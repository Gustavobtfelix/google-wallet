<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cartões de Visitante{% endblock %} · {{ company_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('passes.index') }}">
      <span class="brand-mark">V</span> {{ company_name }} <small>· Visitantes</small>
    </a>
    {% if current_user.is_authenticated %}
    <nav>
      <a href="{{ url_for('passes.index') }}">Cartões</a>
      <a class="btn btn-primary btn-sm" href="{{ url_for('passes.create') }}">+ Novo cartão</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link" type="submit">Sair ({{ current_user.name }})</button>
      </form>
    </nav>
    {% endif %}
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
